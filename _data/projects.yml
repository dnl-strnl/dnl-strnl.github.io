# Cards on /projects/, in display order (two per row). Things you use or look at, not play; games are in games.yml.
#   url:   a live app, relative to this site (project Pages share its origin); previewed in the card like a game.
#   dev:   where that app's local dev server listens; used instead of `url` under `jekyll serve`.
#   preview: extra query string for the card's preview only (e.g. autoplay); the link itself opens `url` as written.
#   image: a still or gif for projects that need a backend and can't run on Pages.
#   post:  slug of the write-up in _posts/; linked once that post is published.
#   repo:  source; linked when there is no live app or published post.
