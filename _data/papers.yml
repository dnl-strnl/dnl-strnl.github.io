# Papers on /papers/. An entry needs only `id`, `url` and `status`: title, authors, year, abstract and
# references come from OpenAlex. After adding papers, run `ruby _scripts/fetch-papers.rb`.
#   id:     short unique slug; threads.yml refers to a paper by it, and it is the paper's anchor (/papers/#paper-<id>).
#   url:    where the paper lives: an arXiv abstract page or a doi.org link.
#   status: reading | read | queue. Papers being read are ringed on the map.
#   label:  optional short name for the map ("TRPO"); the title, shortened, otherwise.
#   area:   optional name for the focus area this paper falls in. Only named groups become areas (and chips);
#           papers given the same name are kept together and papers given different names are kept apart, and
#           every other paper joins the area it is most tied to.
#   note:   optional annotation: a brief thought, shown under the title. Markdown.
#   post:   optional slug of an extended write-up in _posts/ (the rare case); linked once that post is published.
#   title, authors, year, venue: optional; each overrides what OpenAlex returned.
#   doi:    optional; for a paper whose `url` is neither arXiv nor doi.org.
