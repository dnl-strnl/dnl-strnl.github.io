# Books on /library/. "Currently reading" keeps the order here; the other shelves sort by title.
#   id:     short unique slug; threads.yml refers to a book by it, and it is the book's anchor (/library/#book-<id>).
#   subtitle: optional; shown small under the title.
#   status: reading | read | queue (owned, not yet read) | reference (a textbook kept to look things up in). This picks the shelf.
#   cover:  image under assets/images/library/. A transparent PNG keeps its own outline (the shadow follows the alpha);
#           a book with no cover gets a typeset placeholder.
#   note:   a sentence or two, shown under the book. Markdown.
#   post:   slug of a full review in _posts/; the book links to it once that post is published.
#   url:    publisher or author page; linked when there is no published review.
